server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://${MYSQLDB_HOST:localhost}:${MYSQLDB_DOCKER_PORT:3306}/${MYSQLDB_DATABASE:book_storage}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&tinyInt1isBit=true
spring.datasource.username=${MYSQLDB_USER:root}
spring.datasource.password=${MYSQLDB_ROOT_PASSWORD:8388}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

spring.jackson.deserialization.fail-on-unknown-properties=true

jwt.secret=${JWT_SECRET:MySuperSecretKeyForJWT12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:3600000}